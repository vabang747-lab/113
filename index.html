<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Энергоузел Шиели — диспетчерская ГИС</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>
:root{
  --bg:#171b20;--panel:#20262d;--panel2:#282f37;--border:#3b444e;
  --text:#e9edf1;--muted:#9ca7b2;--accent:#39a9ff;--danger:#ff5d5d;
  --green:#48d597;--yellow:#ffd34d;--orange:#ff9f43;
}
*{box-sizing:border-box}
html,body,#map{height:100%;width:100%;margin:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
#map{position:absolute;inset:0}
.leaflet-control-layers,.leaflet-bar a{
  background:#20262d!important;color:#e9edf1!important;border-color:#3b444e!important
}
.leaflet-control-layers-expanded{padding:8px 10px}
.leaflet-control-layers label{margin:5px 0}
.leaflet-control-attribution{background:rgba(20,24,28,.82)!important;color:#aeb8c2}
.leaflet-control-attribution a{color:#7fc7ff}

.topbar{
  position:absolute;z-index:1000;left:14px;top:14px;right:430px;height:52px;
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:rgba(25,30,35,.94);border:1px solid var(--border);border-radius:7px;
  box-shadow:0 4px 18px rgba(0,0,0,.28);pointer-events:none
}
.brand{font-weight:700;letter-spacing:.5px;white-space:nowrap}
.status{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin-left:auto}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.search{
  position:absolute;z-index:1001;top:76px;left:14px;width:330px;
  background:rgba(25,30,35,.95);border:1px solid var(--border);border-radius:7px;
  padding:8px;box-shadow:0 4px 18px rgba(0,0,0,.25)
}
.search input{width:100%;background:#15191e;border:1px solid var(--border);color:#fff;padding:9px 10px;border-radius:5px;outline:none}
.results{max-height:220px;overflow:auto;margin-top:6px}
.result{padding:7px 8px;border-radius:4px;cursor:pointer;font-size:12px}
.result:hover{background:#303942}
.sidebar{
  position:absolute;z-index:1100;top:0;right:0;width:410px;height:100%;
  background:rgba(27,32,38,.97);border-left:1px solid var(--border);
  box-shadow:-6px 0 22px rgba(0,0,0,.3);display:flex;flex-direction:column
}
.sidebar-head{padding:17px 18px 13px;border-bottom:1px solid var(--border)}
.kicker{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--accent);font-weight:700}
.title{font-size:18px;font-weight:700;margin-top:4px;line-height:1.25}
.subtitle{font-size:11px;color:var(--muted);margin-top:5px}
.sidebar-body{padding:14px 16px;overflow:auto}
.section{margin-bottom:18px}
.section h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#b8c1ca;margin:0 0 8px}
table{width:100%;border-collapse:collapse;font-size:12px}
td{padding:7px 6px;border-bottom:1px solid #333b43;vertical-align:top}
td:first-child{color:var(--muted);width:44%}
td:last-child{font-weight:600;color:#f1f4f7}
.link-list{display:flex;flex-direction:column;gap:7px}
.link-btn{
  display:flex;align-items:center;gap:8px;text-decoration:none;color:#dfeeff;
  background:#29333c;border:1px solid #3d4a55;border-radius:5px;padding:8px 10px;font-size:12px
}
.link-btn:hover{background:#33414c;border-color:#5b6c79}
.close{float:right;background:none;border:0;color:#9da8b2;font-size:20px;cursor:pointer}
.legend{
  position:absolute;z-index:1000;bottom:18px;left:14px;background:rgba(25,30,35,.94);
  border:1px solid var(--border);border-radius:6px;padding:10px 12px;font-size:11px;
  box-shadow:0 4px 16px rgba(0,0,0,.25)
}
.legend-row{display:flex;align-items:center;gap:8px;margin:4px 0}
.sw{width:28px;height:4px;border-radius:3px}
.node{width:12px;height:12px;border-radius:50%;border:2px solid #fff}
.focus-note{
  position:absolute;z-index:1000;top:76px;right:425px;background:rgba(25,30,35,.94);
  border:1px solid var(--border);padding:8px 10px;border-radius:5px;color:#cbd3db;font-size:11px;
  display:none
}
@media(max-width:850px){
  .sidebar{width:340px}.topbar{right:350px}.focus-note{right:355px}
}
</style>
</head>

<body>
<div id="map"></div>

<div class="topbar">
  <div class="brand">ЭНЕРГОУЗЕЛ ШИЕЛИ / ДИСПЕТЧЕРСКАЯ ГИС</div>
  <div class="status"><span class="dot"></span> Система готова</div>
</div>

<div class="search">
  <input id="searchInput" placeholder="Поиск ПС, РП, фидера, ТП или линии...">
  <div id="results" class="results"></div>
</div>

<div id="focusNote" class="focus-note"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <button class="close" id="closePanel" title="Закрыть">×</button>
    <div class="kicker">Карточка объекта</div>
    <div class="title" id="objectTitle">Объект не выбран</div>
    <div class="subtitle" id="objectSubtitle">Кликните объект на карте</div>
  </div>
  <div class="sidebar-body">
    <div class="section">
      <h3>Параметры</h3>
      <table id="attrs"><tr><td>Состояние</td><td>Ожидание выбора</td></tr></table>
    </div>
    <div class="section">
      <h3>Внешние ссылки / документация</h3>
      <div id="links" class="link-list"><div style="color:#8f9aa5;font-size:12px">Нет выбранного объекта.</div></div>
    </div>
  </div>
</aside>

<div class="legend">
  <div style="font-weight:700;margin-bottom:6px">КЛАСС НАПРЯЖЕНИЯ</div>
  <div class="legend-row"><span class="sw" style="background:#ff3b30;height:5px"></span> 110 кВ</div>
  <div class="legend-row"><span class="sw" style="background:#ff9f43;height:4px"></span> 35 кВ</div>
  <div class="legend-row"><span class="sw" style="background:#36a8ff;height:4px"></span> 10(6) кВ</div>
  <div class="legend-row"><span class="sw" style="background:#b57cff;height:3px"></span> 0,4 кВ</div>
  <div class="legend-row"><span class="node" style="background:#e34b4b"></span> ПС / РП</div>
  <div class="legend-row"><span class="node" style="background:#ffd34d"></span> ТП / КТП</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
 integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
/* ============================================================
   ДЕМО-ДАННЫЕ
   Иерархия: PS/RP -> feeder -> 10 kV line -> TP -> 0.4 kV line
   Связь строится исключительно через id / parent_id / fed_from.
   При замене демо-данных достаточно сохранить эту схему.
   ============================================================ */
const DATA = [
  {
    id:"ps_shieli", type:"substation", name:'ПС 220/110/35/10 кВ "Шиели"',
    voltage:"220/110/35/10 кВ", coords:[44.18800,66.71990],
    year:"1994", balance:"АО «КРЭК»", power:"Т-1 40 000 кВА; Т-2 16 000 кВА",
    wire:"—", fed_from:"—",
    description:"Главная подстанция энергоузла Шиели.",
    links:[
      ["Гео-схема","https://www.google.com/maps/d/viewer?hl=ru&mid=1UqN86d6VyzQL0MXQDKVtVRaLhrjvZd4"],
      ["ТБ","https://tbkrekshieli.taplink.kz"],
      ["Версия 2.0","https://vabang747-lab.github.io/energo-map/"]
    ]
  },

  {
    id:"f_zalineyniy", type:"feeder", name:"ф. Залинейный", voltage:"10 кВ",
    parent_id:"ps_shieli", fed_from:"ps_shieli",
    path:[[44.18800,66.71990],[44.18737,66.72031],[44.18620,66.72200],[44.18550,66.72450]],
    year:"—", balance:"АО «КРЭК»", power:"—", wire:"АС-70", description:"Фидер 10 кВ от ПС «Шиели»."
  },
  {
    id:"f_mkso", type:"feeder", name:"ф. МКСО", voltage:"10 кВ",
    parent_id:"ps_shieli", fed_from:"ps_shieli",
    path:[[44.18800,66.71990],[44.18480,66.72020],[44.17980,66.72400],[44.17550,66.72850]],
    year:"—", balance:"АО «КРЭК»", power:"—", wire:"АС-70", description:"Фидер 10 кВ от ПС «Шиели»."
  },

  {
    id:"tp_21", type:"tp", name:"КТП №21", voltage:"10/0,4 кВ",
    parent_id:"f_zalineyniy", fed_from:"f_zalineyniy", coords:[44.19043,66.72506],
    year:"—", balance:"АО «КРЭК»", power:"400 кВА", wire:"АС-70",
    description:"Демонстрационная КТП, запитанная от ф. Залинейный.",
    links:[["Гео-схема","https://www.google.com/maps/search/?api=1&query=44.19043,66.72506"]]
  },
  {
    id:"tp_619", type:"tp", name:"КТПН 619", voltage:"10/0,4 кВ",
    parent_id:"f_zalineyniy", fed_from:"f_zalineyniy", coords:[44.18582,66.72585],
    year:"—", balance:"АО «КРЭК»", power:"250 кВА", wire:"АС-50",
    description:"Демонстрационная КТПН, запитанная от ф. Залинейный."
  },
  {
    id:"tp_620", type:"tp", name:"КТПН 620", voltage:"10/0,4 кВ",
    parent_id:"f_mkso", fed_from:"f_mkso", coords:[44.18187,66.74041],
    year:"—", balance:"АО «КРЭК»", power:"250 кВА", wire:"АС-50",
    description:"Демонстрационная КТПН, запитанная от ф. МКСО."
  },
  {
    id:"tp_601", type:"tp", name:"КТП №601", voltage:"10/0,4 кВ",
    parent_id:"f_mkso", fed_from:"f_mkso", coords:[44.18582,66.72585],
    year:"—", balance:"АО «КРЭК»", power:"400 кВА", wire:"АС-70",
    description:"Дополнительная демонстрационная ТП."
  },

  {
    id:"l04_21_a", type:"line04", name:"ВЛ-0,4 кВ от КТП №21 — линия А",
    voltage:"0,4 кВ", parent_id:"tp_21", fed_from:"tp_21",
    path:[[44.19043,66.72506],[44.19130,66.72550],[44.19220,66.72470],[44.19320,66.72380]],
    wire:"СИП-4 4×70", year:"—", balance:"АО «КРЭК»", power:"—",
    description:"ВЛ-0,4 кВ. Скрыта по умолчанию."
  },
  {
    id:"l04_21_b", type:"line04", name:"ВЛ-0,4 кВ от КТП №21 — линия Б",
    voltage:"0,4 кВ", parent_id:"tp_21", fed_from:"tp_21",
    path:[[44.19043,66.72506],[44.18980,66.72630],[44.18910,66.72760],[44.18830,66.72850]],
    wire:"СИП-4 4×50", year:"—", balance:"АО «КРЭК»", power:"—",
    description:"ВЛ-0,4 кВ. Скрыта по умолчанию."
  },
  {
    id:"l04_21_c", type:"input04", name:"Ввод 0,4 кВ / абонентская линия",
    voltage:"0,4 кВ", parent_id:"tp_21", fed_from:"tp_21",
    path:[[44.19043,66.72506],[44.19005,66.72455],[44.18970,66.72410]],
    wire:"СИП-4 2×16", year:"—", balance:"АО «КРЭК»", power:"—",
    description:"Вводная линия 0,4 кВ. Скрыта по умолчанию."
  }
];

/* ---------- Карта и базовые слои ---------- */
const map = L.map("map",{zoomControl:true,preferCanvas:true}).setView([44.18,66.73],14);

const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:20,attribution:"© OpenStreetMap contributors"
});
const carto = L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{
  maxZoom:20,attribution:"© OpenStreetMap © CARTO"
});
const esri = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{
  maxZoom:20,attribution:"Tiles © Esri"
});
const labels = L.tileLayer("https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png",{
  maxZoom:20,attribution:"© CARTO"
});

osm.addTo(map);
L.control.layers({
  "Стандартная схема":osm,
  "Спутник":esri,
  "Гибрид: спутник + подписи":L.layerGroup([esri,labels]),
  "Светлая схема":carto
},null,{collapsed:false,position:"topright"}).addTo(map);

/* ---------- Стили ---------- */
const styles = {
  substation:{color:"#e34b4b",fill:"#e34b4b",radius:10,weight:3},
  rp:{color:"#e34b4b",fill:"#e34b4b",radius:9,weight:3},
  feeder:{color:"#36a8ff",weight:5,opacity:.95},
  line10:{color:"#36a8ff",weight:5,opacity:.95},
  line04:{color:"#b57cff",weight:3,opacity:.95,dashArray:"6 5"},
  input04:{color:"#b57cff",weight:2,opacity:.95,dashArray:"3 5"},
  tp:{color:"#ffd34d",fill:"#ffd34d",radius:7,weight:2}
};

const layers = new Map();
const objects = new Map();
const children = new Map();
let selectedId = null;
let selectedTp04 = new Set();

function addChild(parent,id){
  if(!children.has(parent)) children.set(parent,new Set());
  children.get(parent).add(id);
}
DATA.forEach(o=>{objects.set(o.id,o);if(o.parent_id)addChild(o.parent_id,o.id)});

function makeMarker(o){
  const s=styles[o.type]||styles.tp;
  const m=L.circleMarker(o.coords,{
    radius:s.radius,color:s.color,fillColor:s.fill,fillOpacity:1,weight:s.weight,
    className:"energy-marker"
  });
  m.on("mouseover",()=>{m.setStyle({radius:(s.radius||7)+3,weight:(s.weight||2)+1})});
  m.on("mouseout",()=>{m.setStyle({radius:s.radius,weight:s.weight})});
  m.on("click",e=>{L.DomEvent.stopPropagation(e);selectObject(o.id)});
  m.bindTooltip(o.name,{direction:"top",sticky:true,opacity:.95});
  return m;
}
function makeLine(o){
  const s=styles[o.type]||styles.line10;
  const l=L.polyline(o.path,{color:s.color,weight:s.weight,opacity:s.opacity,dashArray:s.dashArray||null,lineCap:"round",lineJoin:"round"});
  l.on("mouseover",()=>l.setStyle({weight:s.weight+3,opacity:1}));
  l.on("mouseout",()=>refreshLineStyle(o.id));
  l.on("click",e=>{L.DomEvent.stopPropagation(e);selectObject(o.id)});
  l.bindTooltip(o.name,{sticky:true,opacity:.95});
  return l;
}

DATA.forEach(o=>{
  const layer = (o.coords ? makeMarker(o) : makeLine(o));
  layers.set(o.id,layer);
  if(o.type==="line04" || o.type==="input04") {
    // 0.4 kV is intentionally hidden at startup.
  } else layer.addTo(map);
});

/* ---------- Иерархия / фокус ---------- */
function descendants(id){
  const out=new Set([id]);
  const walk=p=>{
    (children.get(p)||[]).forEach(ch=>{if(!out.has(ch)){out.add(ch);walk(ch)}})
  };
  walk(id); return out;
}
function ancestorChain(id){
  const out=new Set(); let cur=objects.get(id);
  while(cur){
    out.add(cur.id);
    cur=cur.parent_id?objects.get(cur.parent_id):null;
  }
  return out;
}
function relatedForSelection(id){
  const o=objects.get(id), set=new Set();
  if(!o)return set;
  if(o.type==="substation" || o.type==="rp"){
    descendants(id).forEach(x=>set.add(x));
  } else if(o.type==="feeder" || o.type==="line10"){
    set.add(o.id);
    // feeder itself + all descendants; 0.4 kV remains hidden
    descendants(o.id).forEach(x=>set.add(x));
    ancestorChain(o.id).forEach(x=>set.add(x));
  } else if(o.type==="tp"){
    set.add(o.id);
    ancestorChain(o.id).forEach(x=>set.add(x));
    (children.get(o.id)||[]).forEach(x=>set.add(x)); // only this TP's 0.4 kV
  } else {
    set.add(o.id); ancestorChain(o.id).forEach(x=>set.add(x));
  }
  return set;
}

function is04(o){return o.type==="line04"||o.type==="input04"}

function refreshLineStyle(id){
  const o=objects.get(id), l=layers.get(id); if(!l)return;
  const s=styles[o.type]||styles.line10;
  let op=s.opacity, wt=s.weight;
  if(selectedId){
    const rel=relatedForSelection(selectedId);
    op=rel.has(id)?1:.25;
    wt=rel.has(id)?s.weight+1:s.weight;
  }
  l.setStyle({opacity:op,weight:wt});
}
function refreshAll(){
  const rel=selectedId?relatedForSelection(selectedId):null;
  DATA.forEach(o=>{
    const l=layers.get(o.id); if(!l)return;
    if(is04(o)){
      const visible=selectedTp04.has(o.parent_id);
      if(visible && !map.hasLayer(l))l.addTo(map);
      if(!visible && map.hasLayer(l))map.removeLayer(l);
    }
    if(o.coords){
      const s=styles[o.type]||styles.tp;
      const op=selectedId?(rel.has(o.id)?1:.25):1;
      l.setStyle({opacity:op,fillOpacity:op,radius:s.radius,weight:s.weight});
    } else refreshLineStyle(o.id);
  });
}
function selectObject(id){
  const o=objects.get(id); if(!o)return;
  selectedId=id;
  selectedTp04.clear();
  if(o.type==="tp") selectedTp04.add(o.id);

  const rel=relatedForSelection(id);
  // Show only the selected TP's 0.4-kV branches; all others remain hidden.
  refreshAll();

  const layer=layers.get(id);
  if(layer){
    const b=layer.getBounds?layer.getBounds():layer.getLatLng?L.latLngBounds([layer.getLatLng()]):null;
    if(b)map.fitBounds(b.pad(.7),{maxZoom:16});
  }
  showCard(o);
  document.getElementById("focusNote").style.display="block";
  document.getElementById("focusNote").textContent="ФОКУС: "+o.name;
}
function resetSelection(){
  selectedId=null;selectedTp04.clear();refreshAll();
  document.getElementById("focusNote").style.display="none";
  clearCard();
}
map.on("click",resetSelection);

/* ---------- Карточка объекта ---------- */
function showCard(o){
  document.getElementById("objectTitle").textContent=o.name;
  document.getElementById("objectSubtitle").textContent=
    (o.type==="substation"?"ПОДСТАНЦИЯ":o.type==="feeder"?"ФИДЕР 10 КВ":
    o.type==="tp"?"ТРАНСФОРМАТОРНЫЙ ПУНКТ":"ЛИНИЯ 0,4 КВ");
  const parent=o.fed_from&&objects.get(o.fed_from);
  const rows=[
    ["ID",o.id],["Напряжение",o.voltage||"—"],["Год ввода",o.year||"—"],
    ["Балансовая принадлежность",o.balance||"—"],["Марка провода/кабеля",o.wire||"—"],
    ["Запитано от",parent?parent.name:(o.fed_from||"—")],
    ["Установленная мощность",o.power||"—"],["Описание",o.description||"—"]
  ];
  document.getElementById("attrs").innerHTML=rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("");
  const links=o.links||[];
  document.getElementById("links").innerHTML=links.length
    ?links.map(x=>`<a class="link-btn" href="${escAttr(x[1])}" target="_blank" rel="noopener noreferrer"><span>↗</span>${esc(x[0])}</a>`).join("")
    :'<div style="color:#8f9aa5;font-size:12px">Внешние ссылки не заданы.</div>';
}
function clearCard(){
  document.getElementById("objectTitle").textContent="Объект не выбран";
  document.getElementById("objectSubtitle").textContent="Кликните объект на карте";
  document.getElementById("attrs").innerHTML='<tr><td>Состояние</td><td>Ожидание выбора</td></tr>';
  document.getElementById("links").innerHTML='<div style="color:#8f9aa5;font-size:12px">Нет выбранного объекта.</div>';
}
document.getElementById("closePanel").onclick=resetSelection;

/* ---------- Поиск ---------- */
const searchInput=document.getElementById("searchInput"), results=document.getElementById("results");
function renderResults(q){
  q=q.trim().toLowerCase();
  if(!q){results.innerHTML="";return}
  const arr=DATA.filter(o=>
    [o.name,o.id,o.voltage,o.wire,o.fed_from,o.description].join(" ").toLowerCase().includes(q)
  ).slice(0,12);
  results.innerHTML=arr.length?arr.map(o=>`<div class="result" data-id="${escAttr(o.id)}">${esc(o.name)} <span style="color:#7f8a95">· ${esc(o.voltage||"")}</span></div>`).join("")
    :'<div style="padding:8px;color:#89939d;font-size:12px">Ничего не найдено</div>';
  results.querySelectorAll(".result").forEach(el=>el.onclick=()=>selectObject(el.dataset.id));
}
searchInput.addEventListener("input",e=>renderResults(e.target.value));

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function escAttr(v){return esc(v)}

/* Стартовое состояние */
refreshAll();
</script>
</body>
</html>
