<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КТПН-10/0,4 кВ №113 — Схема и Данные</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #e9ecef;
      color: #333;
    }

    .btn-container {
      text-align: center;
      margin-bottom: 20px;
      position: sticky;
      top: 10px;
      z-index: 1000;
    }

    .btn {
      padding: 12px 24px;
      font-size: 15px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin: 0 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .btn-print { background: #007bff; }
    .btn-download { background: #28a745; text-decoration: none; display: inline-block; }

    .page-a4 {
      width: 210mm;
      min-height: 297mm;
      padding: 15mm;
      margin: 15px auto;
      background: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      page-break-after: always;
      position: relative;
    }

    h2 {
      margin-top: 0;
      border-bottom: 2px solid #0056b3;
      padding-bottom: 8px;
      color: #0056b3;
    }

    #map {
      width: 100%;
      height: 220mm;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 12px;
    }

    th, td {
      border: 1px solid #dee2e6;
      padding: 6px 10px;
      text-align: left;
    }

    th { background-color: #f8f9fa; color: #495057; }
    tr:nth-child(even) { background-color: #f9f9f9; }

    @media print {
      body { background: none; padding: 0; }
      .btn-container { display: none; }
      .page-a4 { box-shadow: none; margin: 0; padding: 10mm; width: 100%; height: auto; }
      #map { height: 240mm; }
    }
  </style>
</head>
<body>

  <div class="btn-container">
    <button class="btn btn-print" onclick="window.print()">Скачать / Сохранить в PDF (А4)</button>
    <a href="data.geojson" download class="btn btn-download">Скачать файл GeoJSON</a>
  </div>

  <div class="page-a4">
    <h2>КТПН-10/0,4 кВ №113 — Карта-схема ВЛ-0,4 кВ</h2>
    <div id="map"></div>
  </div>

  <div class="page-a4">
    <h2>Перечень объектов КТПН №113</h2>
    <table id="data-table">
      <thead>
        <tr>
          <th>№</th>
          <th>Наименование / Трасса</th>
          <th>Тип геометрии</th>
          <th>Длина / Статус</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map');

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const tbody = document.querySelector('#data-table tbody');
    let rowCount = 1;

    // Загрузка GeoJSON и стилизация как на geojson.io
    fetch('data.geojson?v=' + new Date().getTime())
      .then(response => response.json())
      .then(geojsonData => {
        const geoLayer = L.geoJSON(geojsonData, {
          
          // Стиль линий и полигонов (фиолетовый, как на geojson.io)
          style: function (feature) {
            return {
              color: "#555555",    // Темно-серый контур линии
              weight: 3,          // Толщина линии
              opacity: 0.8,
              fillColor: "#7e57c2",
              fillOpacity: 0.4
            };
          },

          // Отрисовка точечных элементов (если есть) мелким кружком
          pointToLayer: function (feature, latlng) {
            return L.circleMarker(latlng, {
              radius: 4,
              fillColor: "#555555",
              color: "#ffffff",
              weight: 1,
              opacity: 1,
              fillOpacity: 0.9
            });
          },

          onEachFeature: function (feature, layer) {
            const props = feature.properties || {};
            const name = props.name || props.Name || 'Линия ВЛ-0,4 кВ';
            let geomType = feature.geometry ? feature.geometry.type : '—';

            layer.bindPopup(`<b>${name}</b>`);

            const row = `<tr>
              <td>${rowCount++}</td>
              <td><b>${name}</b></td>
              <td>${geomType}</td>
              <td>Введена в схему</td>
            </tr>`;
            tbody.innerHTML += row;
          }
        }).addTo(map);

        // Автоматически фокусируемся на всей трассе
        map.fitBounds(geoLayer.getBounds());
      })
      .catch(err => console.error('Ошибка загрузки GeoJSON:', err));
  </script>
</body>
</html>
